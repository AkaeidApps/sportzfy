name: sportzfy
description: "Sportzfy Clone — a Bangla IPTV learning project built with Flutter."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.11.1

  # Images
  cached_network_image: ^4.0.6

  # Video playback
  video_player: ^2.14.1
  video_player_web_hls: ^1.3.0

  # Local storage
  shared_preferences: ^2.5.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^18.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
